<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23261f">
<title>msefitness · Ciclocomputador LCD</title>
<link rel="stylesheet" href="fonts/silkscreen.css">
<link rel="stylesheet" href="fonts/vt323.css">
<style>
:root{
  --desk:#131511;
  --case:#23261f; --case-hi:#30342b; --case-lo:#161813;
  --print:#aeb5a2; --print-dim:#6f7666;
  --rubber:#3b4037; --rubber-hi:#4a5045; --rubber-lo:#262a23;
  --accent:#d9462b; --accent-hi:#ee6a4c; --accent-lo:#98301c;
  --lcd:#a9b398; --lcd-edge:#8f9a7e; --ink:#1a2015; --ghost:.085;
  --glow:transparent;
}
.lit{ --lcd:#86dcc7; --lcd-edge:#4fae9a; --ink:#0b2620; --ghost:.11; --glow:rgba(120,240,215,.35); }

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--desk)}
body{
  background:var(--desk);
  background-image:radial-gradient(1200px 500px at 20% -10%, #1d2019 0%, transparent 70%);
  color:var(--print); font-family:'VT323',monospace; font-size:20px; line-height:1.1;
  min-height:100vh; padding:40px 48px 64px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* ───────── cabecera de la lámina ───────── */
.board-head{display:grid;grid-template-columns:auto 1fr auto;gap:40px;align-items:end;max-width:1700px;margin:0 auto 40px;border-bottom:2px solid #2b2f27;padding-bottom:28px}
.board-head .num svg{height:92px;display:block}
.board-head .num .on,#segsample .on{fill:#c9d1b8}.board-head .num .off,#segsample .off{fill:#c9d1b8;opacity:.07}
.board-head h1{font-family:'Silkscreen';font-weight:700;font-size:44px;letter-spacing:1px;color:#dfe6cf;line-height:1}
.board-head p{font-size:25px;color:var(--print);margin-top:10px;max-width:760px}
.specimen{display:flex;gap:28px;align-items:flex-end}
.chips{display:grid;grid-template-columns:repeat(3,auto);gap:8px 14px}
.chip{display:flex;align-items:center;gap:8px;font-family:'Silkscreen';font-size:9px;color:var(--print-dim);text-transform:uppercase}
.chip i{width:22px;height:22px;display:block;border:1px solid #0006}
.types{font-size:18px;color:var(--print-dim);line-height:1.35;border-left:1px solid #2b2f27;padding-left:22px}
.types b{font-family:'Silkscreen';font-weight:400;font-size:12px;color:var(--print);display:inline-block;width:92px}
.types .t2{font-size:22px;color:var(--print)}
.global-light{margin-top:10px;font-family:'Silkscreen';font-size:10px;color:var(--print);border:1px solid #3b4037;padding:7px 10px;display:inline-flex;gap:8px;align-items:center}
.global-light:hover{border-color:var(--print-dim)}

/* ───────── marcos de teléfono ───────── */
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:40px 28px;max-width:1700px;margin:0 auto}
.phone{width:390px;height:844px;border-radius:52px;padding:10px;background:#0a0b09;box-shadow:0 0 0 1px #2e322a,0 30px 60px -20px #000c;position:relative}
.phone::before{content:"";position:absolute;top:18px;left:50%;transform:translateX(-50%);width:108px;height:30px;border-radius:20px;background:#000;z-index:5}
.cap{font-family:'Silkscreen';font-size:10px;color:var(--print-dim);text-align:center;margin-top:14px;letter-spacing:1px}
.slot{display:flex;flex-direction:column}

/* ───────── carcasa del ciclocomputador ───────── */
.device{height:100%;border-radius:42px;overflow:hidden;
  background:linear-gradient(170deg,var(--case-hi),var(--case) 30%,var(--case) 75%,var(--case-lo));
  display:flex;flex-direction:column;padding:54px 16px 18px;position:relative}
.device::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background-image:repeating-linear-gradient(90deg,#ffffff03 0 1px,transparent 1px 3px)}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px;font-family:'Silkscreen'}
.brand .logo{font-weight:700;font-size:13px;color:#cfd6bf;letter-spacing:2px}
.brand .logo em{font-style:normal;color:var(--accent)}
.brand .model{font-size:8px;color:var(--print-dim);letter-spacing:2px;margin-left:8px}
.light{display:flex;align-items:center;gap:7px;font-size:8px;color:var(--print-dim);letter-spacing:1px}
.light span{width:30px;height:14px;border-radius:7px;background:var(--rubber);box-shadow:inset 0 1px 0 var(--rubber-hi),0 2px 0 var(--rubber-lo);transition:transform .08s}
.light:active span{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--rubber-hi)}
.lit .light span{background:#3f4a44}

.bezel{flex:1;min-height:0;border-radius:14px;padding:7px;background:linear-gradient(#0f110d,#1b1e17);box-shadow:inset 0 2px 3px #000a,0 1px 0 #ffffff10}
.lcd{height:100%;border-radius:8px;position:relative;overflow:hidden;color:var(--ink);
  background:
    radial-gradient(120% 80% at 50% 40%, var(--glow), transparent 70%),
    linear-gradient(175deg,var(--lcd) 0%,var(--lcd) 60%,var(--lcd-edge) 130%);
  box-shadow:inset 0 3px 8px #0006, inset 0 0 0 1px #0003;
  transition:background .25s}
.lcd::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background-image:linear-gradient(#0000000a 1px,transparent 1px),linear-gradient(90deg,#0000000a 1px,transparent 1px);background-size:3px 3px}
.screen{position:relative;height:100%;overflow-y:auto;scrollbar-width:none;padding:10px 12px 14px;
  filter:drop-shadow(1.5px 2px 0 rgba(0,0,0,.13))}
.screen::-webkit-scrollbar{display:none}

/* teclas físicas */
.keys{display:grid;grid-template-columns:1fr 1.2fr 1fr 1fr 1fr;gap:8px;padding:16px 2px 0}
.key{display:flex;flex-direction:column;align-items:center;gap:7px;font-family:'Silkscreen';font-size:9px;letter-spacing:1px;color:var(--print)}
.key i{display:block;width:100%;height:40px;border-radius:12px;background:linear-gradient(var(--rubber-hi),var(--rubber));box-shadow:0 4px 0 var(--rubber-lo),0 6px 8px #0008;transition:transform .07s,box-shadow .07s}
.key.reg i{background:linear-gradient(var(--accent-hi),var(--accent));box-shadow:0 4px 0 var(--accent-lo),0 6px 8px #0008}
.key.reg{color:#e9b3a6}
.key[aria-pressed="true"] i,.key:active i{transform:translateY(3px);box-shadow:0 1px 0 var(--rubber-lo),0 2px 3px #0008}
.key.reg[aria-pressed="true"] i,.key.reg:active i{box-shadow:0 1px 0 var(--accent-lo),0 2px 3px #0008}
.key[aria-pressed="true"]{color:#e6edd6}

/* ───────── elementos LCD ───────── */
.px{font-family:'Silkscreen';font-size:10px;letter-spacing:.5px;text-transform:uppercase;line-height:1.2}
.px.b{font-weight:700}
.ghost{opacity:var(--ghost)}
.seg{display:block;overflow:visible}
.seg .on{fill:var(--ink)}
.seg .off{fill:var(--ink);opacity:var(--ghost)}
.status{display:flex;justify-content:space-between;align-items:center;height:16px}
.status .r{display:flex;gap:8px;align-items:center}
.modes{display:flex;justify-content:space-between;margin:6px 0 8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.modes span{font-family:'Silkscreen';font-size:10px;padding:1px 4px;position:relative}
.modes span.on{background:var(--ink);color:var(--lcd)}
.modes span.off{opacity:var(--ghost)}
.lit .modes span.on{color:#86dcc7}
.inv{background:var(--ink);color:var(--lcd)}
.lit .inv{color:#86dcc7}
.hr{height:2px;background:var(--ink);margin:10px 0}
.hr.dot{background:none;border-top:2px dotted var(--ink);opacity:.8}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
.flex{display:flex;align-items:center}
.between{display:flex;justify-content:space-between;align-items:flex-end}
.icon{display:inline-block;vertical-align:middle}
.icon .on{fill:var(--ink)}
.t{font-size:20px;line-height:1}
.t.s{font-size:17px}
.cell-label{font-family:'Silkscreen';font-size:8px;opacity:.8}

/* HOY */
.gauge{position:relative;height:190px;margin:2px 0 0}
.gauge svg.arc{position:absolute;inset:0;width:100%;height:100%}
.gauge .mid{position:absolute;left:0;right:0;top:66px;display:flex;flex-direction:column;align-items:center;gap:6px}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin-top:6px}
.trio>div{padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.trio>div+div{border-left:2px dotted var(--ink)}
.zones{display:flex;gap:4px;align-items:center;margin-top:10px}
.zones span{font-family:'Silkscreen';font-size:10px;width:30px;text-align:center;padding:3px 0;border:2px solid var(--ink)}
.zones span.off{opacity:.18}
.zones span.on{background:var(--ink);color:var(--lcd)}
.lit .zones span.on{color:#86dcc7}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:3px}
.week i{display:block;width:100%;height:18px;border:2px solid var(--ink)}
.week i.f{background:var(--ink)}
.week i.n{opacity:.2}
.week i.today{border-style:dashed}
.ticker{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;margin-top:12px}
.duo{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:18px}

/* REG */
.field{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px 0 7px;border-bottom:2px dotted var(--ink)}
.field.sel{border-bottom-style:solid}
.field .lab{grid-column:1/-1;display:flex;justify-content:space-between;margin-bottom:3px}
.field .val{display:flex;justify-content:center;align-items:flex-end;gap:8px}
.step{height:44px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink)}
.step:active{background:var(--ink)}
.step:active .on{fill:var(--lcd)}
.prev{margin-top:10px;padding:8px 10px 10px;border:2px solid var(--ink)}
.bar20{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin-top:6px}
.bar20 i{height:9px;background:var(--ink)}
.bar20 i.o{opacity:var(--ghost)}
.opt{display:flex;justify-content:space-between;align-items:center;padding:8px 0;width:100%;text-align:left;border-bottom:2px dotted var(--ink)}
.optbox{display:none;padding:6px 0 2px}
.open .optbox{display:block}
.open .opt .tri{transform:rotate(90deg)}
.tri{display:inline-block;transition:transform .15s}
.save{width:100%;margin-top:10px;padding:10px 0;display:flex;justify-content:center;gap:10px;align-items:center}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:4px 0 8px}
.rpe i{height:14px;border:2px solid var(--ink);display:block}
.rpe i.f{background:var(--ink)}

/* PROG */
.panel2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.panel2>div{border:2px solid var(--ink);padding:6px 7px 7px}
.odo{display:grid;grid-template-columns:1fr auto;gap:12px;margin-top:10px;align-items:stretch}
.zonebar{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin-top:5px}
.zonebar i{height:12px;display:block;border:1.5px solid var(--ink)}
.zonebar i.f{background:var(--ink)}

/* PLAN */
.sugg{border:2px solid var(--ink);margin-top:2px}
.sugg .h{display:flex;justify-content:space-between;align-items:center;padding:7px 8px}
.sugg .body{padding:8px 8px 10px}
.why{display:grid;grid-template-columns:16px 1fr;gap:4px 8px;align-items:start;padding:6px 0;border-bottom:2px dotted var(--ink)}
.dots10{display:flex;gap:3px;margin-top:4px}
.dots10 i{width:12px;height:12px;border:2px solid var(--ink);display:block}
.dots10 i.f{background:var(--ink)}
.acts{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;margin-top:10px}
.acts button{padding:9px 0;border:2px solid var(--ink);font-family:'Silkscreen';font-size:11px}
.plan{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:2px dotted var(--ink)}
.plan.cur{border:2px solid var(--ink);border-bottom-width:2px;border-bottom-style:solid}
.lvl{display:flex;gap:2px;align-items:flex-end;height:18px}
.lvl i{width:6px;background:var(--ink);display:block}
.lvl i.o{opacity:var(--ghost)}

/* QUEMA */
.guide{border:2px solid var(--ink)}
.guide .h{display:flex;justify-content:space-between;align-items:center;padding:5px 8px}
.guide .b{padding:6px 8px 7px}
.range{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin-top:13px;position:relative}
.range i{height:10px;display:block;border:1.5px solid var(--ink);opacity:.25}
.range i.f{background:var(--ink);opacity:1}
.range b{position:absolute;top:-13px;font-size:10px;line-height:1;transform:translateX(-50%)}
.lvlrow{padding:3px 5px 4px;border-bottom:2px dotted var(--ink)}
.lvlrow.cur{border:2px solid var(--ink)}
.dots8{display:flex;gap:2px}
.dots8 i{width:8px;height:8px;border:1.5px solid var(--ink);display:block}
.dots8 i.f{background:var(--ink)}

/* ───────── móvil real: sin marco, pantallas apiladas ───────── */
@media (max-width:600px){
  body{padding:0 0 24px}
  .board-head{grid-template-columns:1fr;gap:16px;padding:28px 16px 22px;margin-bottom:0}
  .board-head .num svg{height:60px}
  .board-head>*{min-width:0}
  .board-head h1{font-size:23px;overflow-wrap:anywhere}
  .board-head p{font-size:21px}
  .specimen{flex-direction:column;align-items:flex-start;gap:16px}
  .types{border-left:0;padding-left:0}
  .row{gap:0;flex-direction:column}
  .slot{width:100%}
  .phone{width:100%;height:auto;border-radius:0;padding:0;background:none;box-shadow:none}
  .phone::before{display:none}
  .device{border-radius:0;padding:max(18px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));min-height:auto;border-top:2px solid #0a0b09}
  .bezel{flex:none}
  .lcd{height:auto}
  .screen{height:auto;overflow:visible}
  .cap{display:none}
}
</style>
</head>
<body>

<header class="board-head">
  <div class="num" id="bignum"></div>
  <div>
    <h1>Ciclocomputador LCD</h1>
    <p>Tu entrenamiento en la pantalla de un pulsómetro de los 90: dígitos de 7 segmentos con sus fantasmas apagados, barras de píxeles y botones de goma para cambiar de modo.</p>
  </div>
  <div class="specimen">
    <div>
      <div class="chips">
        <div class="chip"><i style="background:#a9b398"></i>LCD</div>
        <div class="chip"><i style="background:#1a2015"></i>Tinta</div>
        <div class="chip"><i style="background:#86dcc7"></i>Retroilum.</div>
        <div class="chip"><i style="background:#23261f"></i>Carcasa</div>
        <div class="chip"><i style="background:#3b4037"></i>Goma</div>
        <div class="chip"><i style="background:#d9462b"></i>Tecla REG</div>
      </div>
      <button class="global-light" id="allLight">☼ Encender todas las luces</button>
    </div>
    <div class="types">
      <div><b>Silkscreen</b><span style="font-family:Silkscreen;font-size:12px">RÓTULOS · MODOS</span></div>
      <div><b>VT323</b><span class="t2">Texto de lectura 0123</span></div>
      <div><b>7 segmentos</b><span id="segsample" style="display:inline-block;vertical-align:middle"></span></div>
    </div>
  </div>
</header>

<main class="row" id="row"></main>

<script>
/* ───────── datos (SPEC.md) ───────── */
const FCMAX = 174, META = 7000, EDAD = 49;
const RAW = [
 ['2026-08-17',30,9.5,146],['2026-08-19',31,9.9,149],['2026-08-21',31,9.9,145],['2026-08-22',34,10.9,145],
 ['2026-08-24',32,10.4,144],['2026-08-26',33,10.7,147],['2026-08-28',33,10.8,143],['2026-08-29',34,11.2,143],
 ['2026-08-31',37,12.2,143],['2026-09-02',29,9.6,145],['2026-09-04',36,12.0,142],['2026-09-05',36,12.1,141],
 ['2026-09-07',37,12.5,141],['2026-09-09',39,13.2,143],['2026-09-11',38,13.0,140],['2026-09-12',38,13.0,139],
 ['2026-09-14',39,13.4,139],['2026-09-16',40,13.8,142],['2026-09-18',42,14.6,138],['2026-09-19',41,14.3,138],
 ['2026-09-21',41,14.4,137],['2026-09-23',42,14.8,140],['2026-09-25',42,14.9,136],['2026-09-26',45,16.0,136]];
const zoneOf = p => p<.6?1:p<.7?2:p<.8?3:p<.9?4:5;
const factorOf = z => z===1?100:z===2?130:160;
const calc = (min,km,fc,fcmax=FCMAX) => { const p=fc/fcmax, z=zoneOf(p), steps=min*factorOf(z);
  return {min,km,fc,p,z,steps,pct:steps/META,eff:km*1000/(fc*min)}; };
const S = RAW.map(([d,min,km,fc]) => ({d,...calc(min,km,fc)}));
const last = S[S.length-1];
const odo = S.reduce((a,s)=>a+s.km,0);
const minZ = z => S.filter(s=>s.z===z).reduce((a,s)=>a+s.min,0);

/* formato chileno */
const fInt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fDec = (n,d=1) => n.toFixed(d).replace('.',',');

/* ───────── 7 segmentos con fantasmas ───────── */
const T=15, G=2.6;
const hseg=(y)=>`${7+G},${y} ${7+G+T/2},${y-T/2} ${93-G-T/2},${y-T/2} ${93-G},${y} ${93-G-T/2},${y+T/2} ${7+G+T/2},${y+T/2}`;
const vseg=(x,y1,y2)=>`${x},${y1+G} ${x+T/2},${y1+G+T/2} ${x+T/2},${y2-G-T/2} ${x},${y2-G} ${x-T/2},${y2-G-T/2} ${x-T/2},${y1+G+T/2}`;
const SEGS={a:hseg(7.5),g:hseg(90),d:hseg(172.5),f:vseg(7.5,7.5,90),b:vseg(92.5,7.5,90),e:vseg(7.5,90,172.5),c:vseg(92.5,90,172.5)};
const MAP={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':'','E':'adefg','r':'eg','P':'abefg','L':'def','o':'cdeg'};
function seg(str,h=40,{ghost=true,cells=null}={}){
  // agrupa punto/coma con el dígito anterior; ':' ocupa celda angosta
  const toks=[]; for(const ch of String(str)){ if((ch==='.'||ch===',')&&toks.length){toks[toks.length-1].dp=ch;} else toks.push({ch}); }
  if(cells) while(toks.length<cells) toks.unshift({ch:' '});
  let x=0, out='';
  for(const t of toks){
    if(t.ch===':'){ out+=`<g transform="translate(${x},0)"><rect class="on" x="4" y="48" width="15" height="15"/><rect class="on" x="4" y="118" width="15" height="15"/></g>`; x+=34; continue; }
    const lit=MAP[t.ch]??'';
    let g='';
    for(const k in SEGS){ const on=lit.includes(k); if(!on&&!ghost) continue; g+=`<polygon class="${on?'on':'off'}" points="${SEGS[k]}"/>`; }
    const dpOn=!!t.dp;
    if(ghost||dpOn){ g+=`<rect class="${dpOn?'on':'off'}" x="101" y="160" width="14" height="14"/>`;
      if(t.dp===',') g+=`<polygon class="on" points="101,174 115,174 108,190 101,190"/>`; }
    out+=`<g transform="translate(${x},0) skewX(-6)">${g}</g>`; x+=128;
  }
  const w=x-8+12;
  return `<svg class="seg" viewBox="-6 0 ${w} 192" style="height:${h}px;width:${h*w/192}px" aria-label="${str}">${out}</svg>`;
}

/* ───────── iconos de 1 bit ───────── */
const ICONS={
 heart:[".XX...XX.","XXXX.XXXX","XXXXXXXXX","XXXXXXXXX",".XXXXXXX.","..XXXXX..","...XXX...","....X...."],
 flame:["...X....","...XX...","..XXX...","..XXXX.X",".XXXXXXX",".XXX.XXX","XXX..XXX","XX....XX",".XXXXXX."],
 check:["........X",".......XX","X.....XX.","XX...XX..",".XX.XX...","..XXX....","...X....."],
 up:["...X...","..XXX..",".XXXXX.","XXXXXXX","..XXX..","..XXX..","..XXX.."],
 down:["..XXX..","..XXX..","..XXX..","XXXXXXX",".XXXXX.","..XXX..","...X..."],
 right:["X....","XX...","XXX..","XXXX.","XXX..","XX...","X...."],
 left:["....X","...XX","..XXX",".XXXX","..XXX","...XX","....X"],
 plus:["..XX..","..XX..","XXXXXX","XXXXXX","..XX..","..XX.."],
 minus:["......","......","XXXXXX","XXXXXX","......","......"],
 batt:["XXXXXXXXXXX.","X.XX.XX.XX.X","X.XX.XX.XX.X","XXXXXXXXXXX."],
 bike:["............XX..",".....XXX...X....","......XXXXXX....","..XXX.X...XXXX..",".X...X...XX...X.","X...X.X.X..X...X","X..XXXXX.X..X..X","X.....X..X.....X",".X...X....X...X.","..XXX......XXX.."],

/* ───────── matriz de puntos ───────── */
function matrix(cols,rows,cw,ch,gap,fn,extra=''){
  let r=''; const W=cols*(cw+gap)-gap, H=rows*(ch+gap)-gap;
  for(let c=0;c<cols;c++) for(let y=0;y<rows;y++){
    const st=fn(c,rows-1-y); const x=c*(cw+gap), yy=y*(ch+gap);
    if(st===1||st===3) r+=`<rect class="on${st===3?' blink':''}" x="${x}" y="${yy}" width="${cw}" height="${ch}"/>`;
    else if(st===2) r+=`<rect x="${x+.75}" y="${yy+.75}" width="${cw-1.5}" height="${ch-1.5}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
    else r+=`<rect class="off" x="${x}" y="${yy}" width="${cw}" height="${ch}"/>`;
  }
  return `<svg class="seg" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:auto">${r}${extra}</svg>`;
}
function pixLine(vals,lo,hi,rows){
  const lv=vals.map(v=>Math.round((v-lo)/(hi-lo)*(rows-1)));
  return matrix(vals.length,rows,5,5,1,(c,y)=>{
    const a=lv[c], b=c>0?lv[c-1]:a; const mn=Math.min(a,b), mx=Math.max(a,b);
    if(y===a) return 1; if(c>0 && y>mn && y<mx) return 1; return 0; });
}

function arc(pct){
  const N=20, a0=-210, a1=30, cx=150, cy=118, r1=96, r2=116, lit=Math.min(N,Math.round(pct*N));
  const pt=(a,r)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)].map(v=>v.toFixed(1)).join(',');
  let p=''; const step=(a1-a0)/N;
  for(let i=0;i<N;i++){ const s=a0+i*step+1.4, e=a0+(i+1)*step-1.4;
    const rr2 = r2 + (i%5===4?6:0);
    p+=`<polygon class="${i<lit?'on':'off'}" points="${pt(s,r1)} ${pt(s,rr2)} ${pt(e,rr2)} ${pt(e,r1)}"/>`; }
  return `<svg class="arc seg" viewBox="0 0 300 200">${p}
    <text x="${cx-104}" y="182" font-family="Silkscreen" font-size="10" fill="var(--ink)">0</text>
    <text x="${cx+62}" y="182" font-family="Silkscreen" font-size="10" fill="var(--ink)">7.000</text></svg>`;
}

function lineGrid(vals,lo,hi,rows,step,styleFn){
  const pts=vals.map((v,i)=>[i*step,Math.round((v-lo)/(hi-lo)*(rows-1))]);
  const cells=new Map();
  pts.forEach((p,i)=>{ if(i){ const [x0,y0]=pts[i-1],[x1,y1]=p; for(let x=x0;x<=x1;x++){ const y=Math.round(y0+(y1-y0)*(x-x0)/(x1-x0)); if(!cells.has(x+','+y)) cells.set(x+','+y,2);} } });

  return (c,y)=>cells.get(c+','+y)||0;

    <div class="bezel"><div class="lcd"><div class="screen"></div></div></div>
    <nav class="keys">${MODES.map(m=>`<button class="key ${m==='reg'?'reg':''}" data-go="${m}">${LABEL[m]}<i></i></button>`).join('')}</nav>
  </div></div><div class="cap">${CAPS[start]}</div>`;
  row.appendChild(slot);
  const dev=slot.querySelector('.device'), scr=slot.querySelector('.screen');
  const st={mode:start,min:45,km:16.0,fc:136,sel:'min',open:false,rpe:6};
  const draw=()=>{ scr.innerHTML=R[st.mode](st);
    dev.querySelectorAll('.key').forEach(k=>k.setAttribute('aria-pressed',k.dataset.go===st.mode)); };
  const bump=(k,d)=>{ st.sel=k;
    if(k==='min') st.min=Math.max(1,Math.min(180,st.min+d));
    if(k==='km') st.km=Math.max(0,Math.round((st.km+d*0.1)*10)/10);
    if(k==='fc') st.fc=Math.max(60,Math.min(210,st.fc+d)); draw(); };
  let rep=null;
  dev.addEventListener('pointerdown',e=>{ const b=e.target.closest('.step'); if(!b) return;
    const k=b.dataset.k,d=+b.dataset.d; bump(k,d); let n=0;
    rep=setInterval(()=>{ if(++n>3) bump(k,d); },120); });
  const stop=()=>{ clearInterval(rep); rep=null; };
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>dev.addEventListener(ev,stop));
  dev.addEventListener('click',e=>{
    const go=e.target.closest('[data-go]'); if(go){ st.mode=go.dataset.go; draw(); scr.scrollTop=0; return; }
    if(e.target.closest('.light')){ dev.classList.toggle('lit'); return; }
    if(e.target.closest('[data-toggle]')){ st.open=!st.open; draw(); return; }
    const r=e.target.closest('[data-rpe]'); if(r){ st.rpe=+r.dataset.rpe; draw(); return; }
    const f=e.target.closest('.field'); if(f && !e.target.closest('.step')){ st.sel=f.dataset.f; draw(); }
  });
  draw();
});
document.getElementById('allLight').addEventListener('click',e=>{
  const devs=[...document.querySelectorAll('.device')], on=!devs.every(d=>d.classList.contains('lit'));
  devs.forEach(d=>d.classList.toggle('lit',on));
  e.currentTarget.textContent=on?'☼ Apagar todas las luces':'☼ Encender todas las luces'; });
document.getElementById('bignum').innerHTML=seg('06',92);
document.getElementById('segsample').innerHTML=seg('7.200',24);
</script>
